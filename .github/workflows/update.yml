name: Publish build

on:
  push:
    branches:
      - master # Only publish when pushing to "main"

jobs:
  publish:
    name: Upload build
    runs-on: ubuntu-latest
    if: contains(github.event.head_commit.message, '[ci skip]') == false

    steps:
      - uses: actions/checkout@v2

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25
          cache: maven
      - name: Install Slimefun (26.3 fork)
        # Zapzaf/Slimefun4 fork with Minecraft 26.3 support (JitPack cannot build it, so it comes from the release)
        env:
          SLIMEFUN_RELEASE: https://github.com/Zapzaf/Slimefun4/releases/download/v4.9-fork.1
          SLIMEFUN_JAR: Slimefun-4.9-UNOFFICIAL-26.3.jar
        run: |
          curl -fsSLO "$SLIMEFUN_RELEASE/$SLIMEFUN_JAR"
          curl -fsSLO "$SLIMEFUN_RELEASE/SHA256SUMS.txt"
          grep "[ *]$SLIMEFUN_JAR\$" SHA256SUMS.txt | sha256sum -c -
          mvn -B install:install-file -Dfile="$SLIMEFUN_JAR" -DgroupId=com.github.Zapzaf \
            -DartifactId=Slimefun4 -Dversion=4.9-UNOFFICIAL-26.3 -Dpackaging=jar
      - name: Build with Maven
        run: mvn -B package

      - name: Upload to Blob Builds
        uses: WalshyDev/blob-builds/gh-action@main
        with:
          project: TranscEndence
          apiToken: ${{ secrets.BLOB_BUILDS }}
          releaseNotes: ${{ github.event.head_commit.message }}